services:
  backend:
    build:
      context: .
      dockerfile: src/YuoCore.Backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Storage__PostgresEnabled: "true"
      Storage__RedisEnabled: "true"
      Storage__PostgresConnectionString: Host=postgres;Port=5432;Database=yuocore;Username=yuocore;Password=yuocore
      Storage__RedisConnectionString: redis:6379
      Game__TickRate: "10"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    ports:
      - "8088:80"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: yuocore
      POSTGRES_USER: yuocore
      POSTGRES_PASSWORD: yuocore
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuocore -d yuocore"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v3.7.3
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
